<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Queen Burger — QR Menu Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/global.css">
  <style>
    body {
      background: radial-gradient(circle at 50% -20%, var(--bg-surface) 0%, var(--bg-primary) 80%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Luxury Light Leaks */
    body::before {
      content: '';
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, rgba(200, 169, 110, 0.08) 0%, transparent 70%);
      filter: blur(50px);
      animation: floatLight 20s infinite alternate;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(200, 169, 110, 0.05) 0%, transparent 70%);
      filter: blur(60px);
      animation: floatLight 25s infinite alternate-reverse;
      pointer-events: none;
    }

    @keyframes floatLight {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(10%, 15%) scale(1.2);
      }
    }

    .landing {
      text-align: center;
      max-width: 400px;
      width: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .landing-logo {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 4px;
      animation: fadeIn 1s ease forwards;
    }

    .landing h1 {
      color: var(--text-main);
      font-size: 2.2rem;
      font-weight: 500;
      margin-bottom: 8px;
      animation: fadeInUp 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    .landing-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 36px;
      line-height: 1.6;
      font-weight: 300;
      animation: fadeInUp 1s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .divider-label {
      font-size: 0.7rem;
      color: var(--text-subtle);
      margin: 12px 0 2px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      animation: fadeIn 1.2s ease forwards;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg-surface-glass);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      text-align: left;
      position: relative;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
      animation: fadeInUp 1.2s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(200, 169, 110, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .link-card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(200, 169, 110, 0.4);
      background: rgba(200, 169, 110, 0.03);
      box-shadow: 0 10px 30px rgba(200, 169, 110, 0.1);
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .link-card-icon {
      width: 48px;
      height: 48px;
      background: rgba(200, 169, 110, 0.1);
      border: 1px solid rgba(200, 169, 110, 0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--gold);
      flex-shrink: 0;
      transition: all 0.4s ease;
    }

    .link-card:hover .link-card-icon {
      background: var(--gold);
      color: #1C1A17;
      transform: rotate(5deg) scale(1.05);
    }

    .link-card-body {
      flex: 1;
      z-index: 2;
    }

    .link-card-title {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
    }

    .link-card-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .link-card-arrow {
      color: var(--text-subtle);
      transition: transform 0.3s var(--bounce), color 0.3s;
      font-size: 18px;
    }

    .link-card:hover .link-card-arrow {
      transform: translateX(4px);
      color: var(--gold);
    }

    .footer-section {
      margin-top: 48px;
      animation: fadeIn 1.5s ease forwards;
    }

    .footer-btn {
      background: none;
      border: 1px dashed rgba(200, 169, 110, 0.3);
      color: var(--gold);
      padding: 6px 16px;
      font-size: 0.72rem;
      border-radius: 20px;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all var(--transition);
    }

    .footer-btn:hover {
      background: rgba(200, 169, 110, 0.1);
      border-color: var(--gold);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="dark-mode">
  <script>
    (function () {
      const theme = localStorage.getItem('gdh_theme') || 'dark';
      if (theme === 'light') document.body.classList.remove('dark-mode');
    })();
  </script>

  <button id="themeToggle" class="theme-toggle-btn" style="position: absolute; top: 20px; right: 20px;"
    aria-label="Toggle theme">
    <i class="ti ti-sun"></i>
  </button>
  <div class="landing">
    <div class="landing-logo">Queen Burger</div>
    <h1>The Queen Menu</h1>
    <p class="landing-desc">Welcome to the restaurant portals. Please choose your interface to continue.</p>

    <div class="links">
      <div class="divider-label">Guest Portal</div>
      <a href="menu.html?table=1" class="link-card">
        <div class="link-card-icon"><i class="ti ti-tools-kitchen-2"></i></div>
        <div class="link-card-body">
          <div class="link-card-title">Queen Menu</div>
          <div class="link-card-desc">Scan QR at table, order & track live</div>
        </div>
        <i class="ti ti-arrow-right link-card-arrow"></i>
      </a>

      <div class="divider-label">Staff Portals</div>
      <a href="kitchen.html" class="link-card">
        <div class="link-card-icon"><i class="ti ti-chef-hat"></i></div>
        <div class="link-card-body">
          <div class="link-card-title">Kitchen Display</div>
          <div class="link-card-desc">Real-time incoming orders queue</div>
        </div>
        <i class="ti ti-arrow-right link-card-arrow"></i>
      </a>

      <a href="admin.html" class="link-card">
        <div class="link-card-icon"><i class="ti ti-layout-dashboard"></i></div>
        <div class="link-card-body">
          <div class="link-card-title">Admin Dashboard</div>
          <div class="link-card-desc">Manage menu, tables, orders & analytics</div>
        </div>
        <i class="ti ti-arrow-right link-card-arrow"></i>
      </a>
    </div>

    <div class="footer-section">
      <button class="footer-btn" onclick="triggerDBReset()">
        <i class="ti ti-refresh"></i> Reset Demo Database
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Ensure DB gets initialized
    getSupabase();

    async function triggerDBReset() {
      if (confirm("Reset local database to default seed menu? (This clears custom orders/items)")) {
        const btn = document.querySelector('.footer-btn');
        const originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner" style="width: 12px; height: 12px; border-width: 1.5px; display: inline-block; vertical-align: middle; margin-right: 6px;"></span> Resetting Database...`;

        try {
          await resetLocalDB();
          playChimeSound('success');
          toast("Database reset to original seed data", "success");
          setTimeout(() => location.reload(), 1200);
        } catch (err) {
          console.error(err);
          toast("Database reset failed. Check console.", "error");
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      }
    }
  </script>
</body>

</html>
